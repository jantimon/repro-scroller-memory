<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>absolute</title>
<style>
  :root { color-scheme: light dark; }

  body {
    margin: 0;
    font: 13px/1.4 system-ui, sans-serif;
  }

  #bar {
    position: fixed;
    inset: 0 0 auto 0;
    z-index: 10;
    padding: 6px 10px;
    background: #111;
    color: #eee;
    font-variant-numeric: tabular-nums;
  }

  #list { padding-top: 34px; }

  .tile {
    padding: 8px 16px 24px;
  }

  .scroller {
    scrollbar-width: none;
    width: 2000px;
    height: 2000px;
    position: relative;
    overflow-x: auto;
  }

  .scroller::-webkit-scrollbar { display: none; }

  .box {
    width: 200px;
    height: 200px;
    background: #c0c6d0;
  }

  .box:nth-child(1) { position: absolute; left: 0px; top: 0 }
  .box:nth-child(2) { position: absolute; left: 216px; top: 0 }
  .box:nth-child(3) { position: absolute; left: 432px; top: 0 }
  .box:nth-child(4) { position: absolute; left: 648px; top: 0 }
  .box:nth-child(5) { position: absolute; left: 864px; top: 0 }
  .box:nth-child(6) { position: absolute; left: 1080px; top: 0 }
  .box:nth-child(7) { position: absolute; left: 1296px; top: 0 }
  .box:nth-child(8) { position: absolute; left: 1512px; top: 0 }
  .box:nth-child(9) { position: absolute; left: 1728px; top: 0 }
  .box:nth-child(10) { position: absolute; left: 1944px; top: 0 }
</style>

<div id="bar"></div>
<div id="list"></div>

<script>
  const params = new URLSearchParams(location.search);
  const size = (key, fallback) => {
    const value = Number(params.get(key));
    return Number.isFinite(value) && value > 0 ? value : fallback;
  };

  const TILES = size("tiles", 1000);
  const SLIDES = size("slides", 10);
  const NESTED = false;
  const NAME = "absolute";

  const record = (phase, extra) => {
    const state = { page: NAME, rows: TILES, phase, ...extra };
    document.title = NAME + " " + TILES + " " + phase;
    try {
      localStorage.setItem("run", JSON.stringify(state));
    } catch {}
    return state;
  };

  record("start");

  const fragment = document.createDocumentFragment();

  for (let tile = 0; tile < TILES; tile++) {
    const row = document.createElement("div");
    row.className = "tile";

    const scroller = document.createElement("div");
    scroller.className = "scroller";

    for (let slide = 0; slide < SLIDES; slide++) {
      const box = document.createElement("div");
      box.className = "box";
      if (NESTED) {
        const cell = document.createElement("div");
        cell.className = "slide";
        cell.appendChild(box);
        scroller.appendChild(cell);
      } else {
        scroller.appendChild(box);
      }
    }

    row.appendChild(scroller);
    fragment.appendChild(row);
  }

  document.getElementById("list").appendChild(fragment);

  const elements = document.getElementsByTagName("*").length;
  record("built", { elements });
  document.getElementById("bar").textContent =
    NAME + " — " + TILES + " rows × " + SLIDES + " slides, " + elements + " elements";

  if (params.has("scroll-down")) {
    let previous = -1;
    let stalled = 0;
    const step = () => {
      const bottom = document.documentElement.scrollHeight - window.innerHeight;
      if (window.scrollY >= bottom - 2) {
        record("scrolled", { elements });
        return;
      }
      if (window.scrollY === previous) {
        stalled++;
        if (stalled > 180) {
          record("stalled", { elements, at: window.scrollY });
          return;
        }
      } else {
        stalled = 0;
      }
      previous = window.scrollY;
      window.scrollBy(0, window.innerHeight);
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
</script>
